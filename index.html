<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#5ab8ff;font-family:'VT323',monospace}
#game{position:fixed;inset:0}
#game canvas{display:block}
body:after{content:"";position:fixed;inset:0;z-index:8;pointer-events:none;background:radial-gradient(circle at 52% 42%,transparent 52%,rgba(16,31,48,.07) 100%);mix-blend-mode:multiply}

.hud .title{font-family:'Press Start 2P',monospace;font-size:13px;color:#fff;text-shadow:3px 3px 0 #2b1a0a,5px 5px 0 #000}
.hud .hint{pointer-events:auto;font-family:'VT323',monospace;font-size:16px;background:rgba(22,33,62,0.9);border:2px solid #9c9279;color:#efe5cc;padding:4px 10px;cursor:pointer}
.hud .hint:hover{background:rgba(22,33,62,1)}
.hotbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10;background:rgba(0,0,0,0.38);padding:8px 10px;border:3px solid #000}
.slot{width:46px;height:46px;background:#8b8b8b;border:3px solid #373737;border-top-color:#fff;border-left-color:#fff;position:relative;cursor:pointer;image-rendering:pixelated}
.slot.sel{border-color:#ffde59;box-shadow:0 0 0 2px #000}
.slot canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.slot span{position:absolute;bottom:0;right:2px;font-family:'Press Start 2P',monospace;font-size:7px;color:#fff;text-shadow:1px 1px 0 #000}
.crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;pointer-events:none;z-index:10}
.crosshair:before,.crosshair:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
.crosshair:before{left:8px;top:0;width:2px;height:18px}
.crosshair:after{left:0;top:8px;width:18px;height:2px}
.controls{position:fixed;bottom:14px;left:14px;z-index:10;background:rgba(22,33,62,0.9);border:2px solid #9c9279;color:#cbd5e1;font-size:14px;line-height:1.35;padding:7px 10px;max-width:300px}
.controls b{color:#ffde59}
/* Main menu */
#mainMenu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center, rgba(90,184,255,0.15) 0%, rgba(10,20,40,0.55) 100%);backdrop-filter:blur(1px)}
#mainMenu.hidden{display:none}
.menu-card{background:rgba(27,32,28,0.94);border:3px solid #9c9279;box-shadow:0 0 0 4px #171b17,0 8px 32px rgba(0,0,0,.4);padding:28px 28px 22px;min-width:380px;max-width:480px;text-align:center}
.menu-card h1{font-family:'Press Start 2P',monospace;font-size:20px;color:#ffde59;text-shadow:4px 4px 0 #2b1a0a, 6px 6px 0 #000;letter-spacing:1px;line-height:1.3}
.menu-card .sub{font-family:'VT323',monospace;font-size:18px;color:#8ec9ff;margin:8px 0 18px;letter-spacing:2px;text-transform:uppercase}
.menu-btn{width:100%;display:block;font-family:'Press Start 2P',monospace;font-size:11px;padding:14px 12px;margin:10px 0;border:3px solid #000;cursor:pointer;transition:transform 0.06s, filter 0.12s;text-transform:uppercase;letter-spacing:0.5px}
.menu-btn:active{transform:translateY(2px)}
.btn-free{background:linear-gradient(#7ed321,#5a9a0a);color:#fff;text-shadow:2px 2px 0 #2b5a0a;box-shadow:inset 0 3px 0 rgba(255,255,255,0.4), inset 0 -3px 0 rgba(0,0,0,0.25)}
.btn-free:hover{filter:brightness(1.12)}
.btn-farm{background:linear-gradient(#ff8c2a,#d94a0a);color:#fff;text-shadow:2px 2px 0 #6b1f00;box-shadow:inset 0 3px 0 rgba(255,255,255,0.35), inset 0 -3px 0 rgba(0,0,0,0.25)}
.btn-farm:hover{filter:brightness(1.12)}
.menu-card small{color:#7a8db5;font-size:13px;margin-top:10px;display:block}
.menu-badge{margin-top:12px;font-size:12px;color:#3a557a;background:rgba(0,0,0,0.35);padding:4px 8px;display:inline-block;border:1px solid rgba(0,245,255,0.3)}
/* Hide game HUD when in menu */
body.menu-mode .hud, body.menu-mode .hotbar, body.menu-mode .crosshair, body.menu-mode .controls, body.menu-mode #debug{display:none !important}
#debug{display:none!important} #battleHud{position:fixed;top:56px;left:14px;color:#fff4dc;background:#222a20df;padding:10px 14px;border:2px solid #9c9279;z-index:10;font:18px \'VT323\',monospace;pointer-events:none} #battleHud:empty{display:none} .menu-card small{color:#c6c6ad}.menu-badge{color:#c6c6ad} @media(max-width:650px){.controls{bottom:80px;font-size:12px;max-width:240px}.slot{width:32px;height:36px}.hotbar{gap:3px}.menu-card{min-width:0;width:92%}.hud .hint{font-size:12px}.hud .title{font-size:10px}}
</style>
</head>
<body class="menu-mode">
<div id="game"></div>
<div class="hud">
  <div class="title">BLOCKCRAFT 2.5D</div>
  <div class="hint" id="btnBack">ESC — Menu • LMB break • RMB place • R reset</div>
</div>

<!-- Main Menu -->
<div id="mainMenu">
  <div class="menu-card">
    <h1>BLOCKCRAFT<br>2.5D</h1>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="terrain16.js"></script>
<script>
(function(){
var WORLD=42, HEIGHT=18, ATLAS_COLS=16;
var BLOCK={AIR:0,GRASS:1,DIRT:2,STONE:3,WOOD:4,LEAVES:5,SAND:6,PLANKS:7,SNOW:8,FURNACE:9,BRICK:10,COBBLE:11};
var TILE={grassTop:0,grassSide:1,dirt:2,stone:3,woodSide:4,woodTop:5,leaves:6,sand:7,planks:8,snow:9,furnaceSide:10,furnaceFront:11,brick:12,cobble:13,tuft:14};

function mk(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c}
var textureImages={},atlasInfo,atlasTex,atlasMat;
function tileRect(tile){return {x:tile*18+1,y:1,size:16};}
function makeAtlas(){
  var atlas=mk(ATLAS_COLS*18,18),g=atlas.getContext('2d');
  g.imageSmoothingEnabled=false;
  var names=['grass','grass_side','dirt','stone','tree','tree_top','leaves','sand','wood','snow','furnace_side','furnace_front','stone_brick','cobble','grass_3'];
  names.forEach(function(name,tile){
    var c=mk(16,16),p=c.getContext('2d');p.imageSmoothingEnabled=false;
    if(name==='grass_side')p.drawImage(textureImages.dirt,0,0);
    p.drawImage(textureImages[name],0,0);
    var x=tile*18+1;g.drawImage(c,x,1);
    // One-pixel gutters preserve all 16 texels at tile boundaries.
    g.drawImage(c,0,0,16,1,x,0,16,1);g.drawImage(c,0,15,16,1,x,17,16,1);
    g.drawImage(c,0,0,1,16,x-1,1,1,16);g.drawImage(c,15,0,1,16,x+16,1,1,16);
  });
  var tex=new THREE.CanvasTexture(atlas);tex.encoding=THREE.sRGBEncoding;
  tex.magFilter=THREE.NearestFilter;tex.minFilter=THREE.NearestFilter;tex.generateMipmaps=false;
  return {atlas:atlas,tex:tex};
}
function loadTextures(){
  return Promise.all(Object.keys(window.TERRAIN16_PNG).map(function(name){
    return new Promise(function(resolve,reject){
      var img=new Image();img.onload=function(){if(img.width!==16||img.height!==16)return reject(new Error('Invalid texture dimensions'));textureImages[name]=img;resolve();};
      img.onerror=function(){reject(new Error('Texture load failed: '+name));};
      img.src='data:image/png;base64,'+window.TERRAIN16_PNG[name];
    });
  })).then(function(){
    atlasInfo=makeAtlas();atlasTex=atlasInfo.tex;
    atlasMat=new THREE.MeshLambertMaterial({map:atlasTex,vertexColors:true,alphaTest:.42,side:THREE.DoubleSide});
  });
}

function tileFor(block, face){
  if(block===BLOCK.GRASS){ if(face===2) return TILE.grassTop; if(face===3) return TILE.dirt; return TILE.grassSide; }
  if(block===BLOCK.BRICK)return TILE.brick;
  if(block===BLOCK.COBBLE)return TILE.cobble;
  if(block===BLOCK.DIRT) return TILE.dirt;
  if(block===BLOCK.STONE) return TILE.stone;
  if(block===BLOCK.WOOD){ if(face===2||face===3) return TILE.woodTop; return TILE.woodSide; }
  if(block===BLOCK.LEAVES) return TILE.leaves;
  if(block===BLOCK.SAND) return TILE.sand;
  if(block===BLOCK.PLANKS) return TILE.planks;
  if(block===BLOCK.SNOW){ if(face===2) return TILE.snow; if(face===3) return TILE.dirt; return TILE.snow; }
  if(block===BLOCK.FURNACE){ if(face===4) return TILE.furnaceFront; if(face===2||face===3) return TILE.furnaceSide; return TILE.furnaceSide; }
  return 0;
}

var scene,camera,renderer,controls,raycaster,mouse,world,worldMesh,cloudGroup,skyDome,water,sunLight;
var player, playerX, playerZ, playerY, velY=0, velX=0, velZ=0, coyote=0, jBuffer=0, grounded=false, wasGrounded=false, landBounce=0;
var selected=1;
var keys={}, sprint=false;
var gameMode='menu'; // menu | free | farm
var furnaceGroup=null, fireSprites=[], smokeSprites=[];
var menuAngle=0.6;


var sceneTarget,postScene,postCamera,postMaterial,reflectionTarget,reflectionCamera,reflectionMatrix=new THREE.Matrix4(),reflectionTick=0;
function initPost(){
  var size=renderer.getDrawingBufferSize(new THREE.Vector2());
  sceneTarget=new THREE.WebGLRenderTarget(size.x,size.y,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,depthBuffer:true,stencilBuffer:false});
  // The scene is tone-mapped and encoded once; this pass grades display colors.
  sceneTarget.texture.encoding=THREE.sRGBEncoding;
  sceneTarget.texture.generateMipmaps=false;
  var depthSupported=renderer.capabilities.isWebGL2||renderer.extensions.has('WEBGL_depth_texture');
  if(depthSupported){sceneTarget.depthTexture=new THREE.DepthTexture(size.x,size.y);sceneTarget.depthTexture.type=THREE.UnsignedShortType;}
  reflectionTarget=new THREE.WebGLRenderTarget(Math.max(1,Math.floor(size.x/2)),Math.max(1,Math.floor(size.y/2)));reflectionTarget.texture.encoding=THREE.sRGBEncoding;
  reflectionCamera=camera.clone();
  postMaterial=new THREE.ShaderMaterial({depthTest:false,depthWrite:false,toneMapped:false,uniforms:{
    sceneColor:{value:sceneTarget.texture},sceneDepth:{value:sceneTarget.depthTexture||sceneTarget.texture},hasDepth:{value:depthSupported?1:0},texel:{value:new THREE.Vector2(1/size.x,1/size.y)}
  },vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}',
  fragmentShader:[
    'uniform sampler2D sceneColor;uniform sampler2D sceneDepth;uniform float hasDepth;uniform vec2 texel;varying vec2 vUv;',
    'vec3 bright(vec2 p){vec3 c=texture2D(sceneColor,p).rgb;float l=dot(c,vec3(.2126,.7152,.0722));return c*smoothstep(.72,.98,l);}',
    'void main(){vec3 c=texture2D(sceneColor,vUv).rgb;vec3 bloom=vec3(0.0);',
    'for(int x=-1;x<=1;x++){for(int y=-1;y<=1;y++){bloom+=bright(vUv+vec2(float(x),float(y))*texel*4.0);}}',
    'float depth=texture2D(sceneDepth,vUv).r;float occ=0.0;',
    'for(int i=0;i<8;i++){float a=float(i)*.785398;float nearDepth=texture2D(sceneDepth,vUv+vec2(cos(a),sin(a))*texel*5.0).r;float delta=(depth-nearDepth)*999.9;occ+=smoothstep(.06,.35,delta)*(1.0-smoothstep(.8,2.5,delta));}',
    'c*=1.0-occ*.035*hasDepth*(1.0-step(.995,depth));',
    'float l=dot(c,vec3(.2126,.7152,.0722));float warm=smoothstep(.2,.85,l);',
    'c*=mix(vec3(.97,.99,1.02),vec3(1.025,1.01,.97),warm);',
    'l=dot(c,vec3(.2126,.7152,.0722));c=mix(vec3(l),c,1.04);c=(c-.5)*1.035+.5;',
    'c+=bloom*(.065/9.0)*vec3(1.0,.94,.8);gl_FragColor=vec4(clamp(c,0.0,1.0),1.0);}'
  ].join('\n')});
  postScene=new THREE.Scene();postCamera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),postMaterial));
}
function renderFrame(){
  if(water&&reflectionTick++%3===0){
    reflectionCamera.copy(camera);reflectionCamera.position.y=-.3-camera.position.y;
    var direction=camera.getWorldDirection(new THREE.Vector3());direction.y=-direction.y;
    reflectionCamera.up.set(0,-1,0);reflectionCamera.lookAt(reflectionCamera.position.clone().add(direction));reflectionCamera.updateMatrixWorld();
    reflectionMatrix.multiplyMatrices(reflectionCamera.projectionMatrix,reflectionCamera.matrixWorldInverse);
    water.visible=false;var shadowAuto=renderer.shadowMap.autoUpdate;renderer.shadowMap.autoUpdate=false;
    renderer.clippingPlanes=[new THREE.Plane(new THREE.Vector3(0,1,0),.15)];
    renderer.setRenderTarget(reflectionTarget);renderer.render(scene,reflectionCamera);
    renderer.clippingPlanes=[];renderer.shadowMap.autoUpdate=shadowAuto;water.visible=true;
  }
  renderer.setRenderTarget(sceneTarget);renderer.render(scene,camera);
  renderer.setRenderTarget(null);renderer.render(postScene,postCamera);
}
function resizePost(){
  if(!sceneTarget)return;
  var size=renderer.getDrawingBufferSize(new THREE.Vector2());
  sceneTarget.setSize(size.x,size.y);reflectionTarget.setSize(Math.max(1,Math.floor(size.x/2)),Math.max(1,Math.floor(size.y/2)));reflectionTick=0;postMaterial.uniforms.texel.value.set(1/size.x,1/size.y);
}

function init(){
  var el=document.getElementById('game');
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x5ab8ff);
  scene.fog=new THREE.Fog(0xbecbd0, 68, 155);
  var aspect=el.clientWidth/el.clientHeight;
  var d=15;
  camera=new THREE.OrthographicCamera(-d*aspect,d*aspect,d,-d,0.1,1000);
  camera.position.set(28,28,28);
  camera.lookAt(0,0,0);
  renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.75));
  renderer.setSize(el.clientWidth, el.clientHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.0;
  initPost();
  el.appendChild(renderer.domElement);
  renderer.domElement.tabIndex=0;
  renderer.domElement.focus();
  el.addEventListener('click', function(){ if(gameMode!=='menu') renderer.domElement.focus(); });
  controls=new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0,0,0);
  controls.enableDamping=true; controls.dampingFactor=0.12;
  controls.enablePan=true;
  controls.enableKeys=false;
  controls.mouseButtons={LEFT:THREE.MOUSE.PAN, MIDDLE:THREE.MOUSE.ROTATE, RIGHT:THREE.MOUSE.DOLLY};
  controls.minZoom=0.5; controls.maxZoom=2.6;
  controls.maxPolarAngle=Math.PI/2 - 0.08;
  controls.minPolarAngle=0.25;
  var amb=new THREE.AmbientLight(0xd4deee,0.16);
  scene.add(amb);
  sunLight=new THREE.DirectionalLight(0xffedcd,1.35);
  sunLight.position.set(45,32,28);
  sunLight.castShadow=true;
  sunLight.shadow.mapSize.set(2048,2048);
  sunLight.shadow.camera.near=0.5;sunLight.shadow.camera.far=120;
  sunLight.shadow.camera.left=-31;sunLight.shadow.camera.right=31;
  sunLight.shadow.camera.top=31;sunLight.shadow.camera.bottom=-31;
  sunLight.shadow.bias=-0.00018;sunLight.shadow.normalBias=0.025;sunLight.shadow.radius=2;
  scene.add(sunLight);
  var fill=new THREE.DirectionalLight(0x79a8e0,0.08);
  fill.position.set(-30,25,-25);
  scene.add(fill);
  scene.add(new THREE.HemisphereLight(0xa2c8ed,0x6a7146,0.5));
  var rim=new THREE.DirectionalLight(0xffe0ab,0.08);
  rim.position.set(-12,18,40);
  scene.add(rim);
  buildSky();buildWater();
  world=createIslands();
  // Clouds are shaded in the sky dome to keep the horizon continuous.
  rebuildWorldMesh();
  buildPlayer();
  buildHotbar();
  raycaster=new THREE.Raycaster(); mouse=new THREE.Vector2();
  el.addEventListener('mousemove', onMouseMove);
  el.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('keydown', onKeyDown);
  document.addEventListener('keydown', onKeyDown);
  function onKeyUp(e){ var k=e.key.toLowerCase(); var kc=e.code?e.code.toLowerCase():''; keys[k]=false; if(kc) keys[kc]=false; if(k===' '||kc==='space') keys[' '] = false; if(kc==='keyw') keys['w']=false; if(kc==='keya') keys['a']=false; if(kc==='keys') keys['s']=false; if(kc==='keyd') keys['d']=false; if(e.key==='Shift') sprint=false; }
  window.addEventListener('keyup', onKeyUp);
  document.addEventListener('keyup', onKeyUp);
  window.addEventListener('contextmenu', function(e){e.preventDefault()});
  window.addEventListener('resize', onResize);
  new ResizeObserver(onResize).observe(el);
  setupMenu();
  updateMenuVisibility();
  requestAnimationFrame(animate);
}

function createIslands(){
  var w=[];
  for(var x=0;x<WORLD;x++){w[x]=[]; for(var z=0;z<WORLD;z++){w[x][z]=[]; for(var y=0;y<HEIGHT;y++) w[x][z][y]=0}}
  var islands=[
    {cx:21,cz:21,rx:9,rz:8, base:3, h:3.2, biome:'forest'},
    {cx:8, cz:8, rx:5,rz:5, base:3, h:2.5, biome:'snow'},
    {cx:33,cz:33, rx:5,rz:5, base:3, h:2.6, biome:'desert'},
    {cx:33,cz:8, rx:4,rz:4, base:3, h:2.0, biome:'forest'},
    {cx:8, cz:33, rx:4,rz:4, base:3, h:2.3, biome:'desert'}
  ];
  islands.forEach(function(isl){
    for(var x=Math.max(0,isl.cx-isl.rx-1); x<Math.min(WORLD,isl.cx+isl.rx+1); x++){
      for(var z=Math.max(0,isl.cz-isl.rz-1); z<Math.min(WORLD,isl.cz+isl.rz+1); z++){
        var dx=(x-isl.cx)/isl.rx, dz=(z-isl.cz)/isl.rz;
        var d=Math.sqrt(dx*dx+dz*dz);
        if(d>1) continue;
        var h = Math.floor((1-d)*isl.h + isl.base);
        var rnd=(Math.sin(x*1.7)+Math.cos(z*1.9))*0.35;
        h+= (rnd>0.5?1:0);
        if(h<isl.base) h=isl.base;
        if(h>=HEIGHT) h=HEIGHT-1;
        for(var y=0;y<h;y++){
          if(isl.biome==='desert'){
            if(y>=h-1) w[x][z][y]=BLOCK.SAND;
            else if(y>=h-2) w[x][z][y]=BLOCK.SAND;
            else if(y<2) w[x][z][y]=BLOCK.STONE;
            else w[x][z][y]=BLOCK.SAND;
          } else if(isl.biome==='snow'){
            if(y===h-1) w[x][z][y]=BLOCK.SNOW;
            else if(y===h-2) w[x][z][y]=BLOCK.SNOW;
            else if(y<2) w[x][z][y]=BLOCK.STONE;
            else w[x][z][y]=BLOCK.DIRT;
          } else {
            if(y===h-1) w[x][z][y]=BLOCK.GRASS;
            else if(y>=h-2) w[x][z][y]=BLOCK.DIRT;
            else if(y<2) w[x][z][y]=BLOCK.STONE;
            else w[x][z][y]=BLOCK.DIRT;
          }
        }
        if(isl.biome==='forest' && d<0.4 && h>3 && Math.random()<0.07){ w[x][z][h]=BLOCK.SAND; }
      }
    }
  });
  islands.forEach(function(isl){
    var count = isl.biome==='desert'? 3 : 2;
    for(var t=0;t<count;t++){
      var tx=Math.floor(isl.cx + (Math.random()-0.5)*isl.rx*1.2);
      var tz=Math.floor(isl.cz + (Math.random()-0.5)*isl.rz*1.2);
      if(tx<1||tx>=WORLD-1||tz<1||tz>=WORLD-1) continue;
      var top=-1; for(var y=HEIGHT-1;y>=0;y--) if(w[tx][tz][y]!==0){top=y;break}
      if(top<0) continue;
      if(isl.biome==='desert'){
        if(w[tx][tz][top]!==BLOCK.SAND) continue;
        var h2=2+Math.floor(Math.random()*2);
        for(var y=1;y<=h2;y++) if(top+y<HEIGHT && w[tx][tz][top+y]===0) w[tx][tz][top+y]=BLOCK.WOOD;
      } else {
        if(w[tx][tz][top]!==BLOCK.GRASS && w[tx][tz][top]!==BLOCK.SNOW) continue;
        var trunk=3+Math.floor(Math.random()*2);
        for(var y=1;y<=trunk;y++) if(top+y<HEIGHT) w[tx][tz][top+y]=BLOCK.WOOD;
        var ly=top+trunk;
        for(var dx=-1;dx<=1;dx++) for(var dz=-1;dz<=1;dz++) for(var dy=0;dy<=1;dy++){

function onKeyDown(e){
  var k=e.key.toLowerCase();
  if(gameMode==='farm'&&!e.repeat){if(k==='f')playerAttack();if(k==='g'){battle.rally=!battle.rally;updateBattleHud();}}

  if(gameMode==='menu') return;
  if(k>='1'&&k<='9'){ var num=parseInt(k); if(num>=1&&num<=9) setSelected(num); }
  if(k==='r'){ resetWorld(); }
  if(e.key==='Shift') sprint=true;
  if((kc==='space'||k===' ')&&!keys[' ']&&!keys['space']) jBuffer=.14;
  keys[k]=true;
  if(kc) keys[kc]=true;
  if(kc==='space' || k===' ') keys[' '] = true;
  if(kc==='keyw') keys['w']=true;
  if(kc==='keya') keys['a']=true;
  if(kc==='keys') keys['s']=true;
  if(kc==='keyd') keys['d']=true;
  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' ','keyw','keya','keys','keyd','space'].indexOf(k)>=0 || ['keyw','keya','keys','keyd','space'].indexOf(kc)>=0) e.preventDefault();
}

var mouseDownPos=null, isDragging=false;
function onMouseMove(e){
  var r=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX - r.left)/r.width)*2-1; mouse.y=-((e.clientY - r.top)/r.height)*2+1;
  if(mouseDownPos && Math.hypot(e.clientX-mouseDownPos.x, e.clientY-mouseDownPos.y)>7) isDragging=true;
}
function onPointerDown(e){
  if(gameMode==='menu') return;
  mouseDownPos={x:e.clientX,y:e.clientY}; isDragging=false;
  var up=function(ev){
    window.removeEventListener('pointerup', up);
    if(isDragging) return;
    onMouseMove(ev);
    if(ev.button===0) doBreak();
    if(ev.button===2) doPlace();
  };
  window.addEventListener('pointerup', up);
}
function doBreak(){
  if(gameMode==='farm'&&playerAttack())return;
  raycaster.setFromCamera(mouse, camera);
  var hits=raycaster.intersectObject(worldMesh);
  if(!hits.length) return;
  var p=hits[0].point.clone().sub(hits[0].face.normal.clone().multiplyScalar(0.05));
  var bx=Math.floor(p.x + WORLD/2), by=Math.floor(p.y), bz=Math.floor(p.z + WORLD/2);
  if(bx<0||bx>=WORLD||bz<0||bz>=WORLD||by<0||by>=HEIGHT) return;
  if(world[bx][bz][by]===0) return;
  if(bx===playerX && bz===playerZ && by===highestAt(playerX,playerZ)) return;
  world[bx][bz][by]=0;
  rebuildWorldMesh();
  if(gameMode==='farm') refreshFurnaceEffects();
}
function doPlace(){
  raycaster.setFromCamera(mouse, camera);
  var hits=raycaster.intersectObject(worldMesh);
  if(!hits.length) return;
  var h=hits[0];
  var n=h.face.normal.clone();
  var p=h.point.clone().add(n.clone().multiplyScalar(0.05));
  var bx=Math.floor(p.x + WORLD/2), by=Math.floor(p.y), bz=Math.floor(p.z + WORLD/2);
  if(bx<0||bx>=WORLD||bz<0||bz>=WORLD||by<0||by>=HEIGHT) return;
  if(world[bx][bz][by]!==0) return;
  if(bx===playerX && bz===playerZ && by===Math.floor(playerY)) return;
  world[bx][bz][by]=selected;
  rebuildWorldMesh();
  if(gameMode==='farm') refreshFurnaceEffects();
}

  for(var x=0;x<WORLD;x++) for(var z=0;z<WORLD;z++) for(var y=0;y<HEIGHT;y++){
    if(world[x][z][y]===BLOCK.FURNACE){
      var wx=x - WORLD/2 +0.5, wy=y+0.5, wz=z - WORLD/2 +0.5;
      // fire plane in front (+Z)

      fireTex.magFilter=THREE.NearestFilter; fireTex.minFilter=THREE.NearestFilter;
      var fireMat=new THREE.MeshBasicMaterial({map:fireTex, transparent:true, side:THREE.DoubleSide, depthWrite:false});
      // two crossed planes for volume
      var g=new THREE.Group();
      var p1=new THREE.Mesh(new THREE.PlaneGeometry(0.55,0.65), fireMat);
      p1.position.set(0,0,0.52); // just in front of block face
      var p2=new THREE.Mesh(new THREE.PlaneGeometry(0.55,0.65), fireMat.clone());
      p2.rotation.y=Math.PI/2; p2.position.set(0,0,0.52);
      // keep refs for animation

      g.position.set(wx, wy, wz);
      g.userData={canvas:fireCanvas, tex:fireTex, mats:[fireMat, p2.material], baseY:wy, seed:Math.random()*10, wx:wx, wz:wz, wy:wy};
      furnaceGroup.add(g);

      var smokeTex=new THREE.CanvasTexture(smokeCanvas);
      smokeTex.magFilter=THREE.NearestFilter;
      var smokeMat=new THREE.SpriteMaterial({map:smokeTex, transparent:true, opacity:0.75, depthWrite:false});
      var smoke=new THREE.Sprite(smokeMat);

      smoke.scale.set(1.1,1.1,1.1);
      smoke.userData={canvas:smokeCanvas, tex:smokeTex, t:Math.random()*5};
      furnaceGroup.add(smoke);

  }

function drawFireFrame(canvas, t, seed){
  var g=canvas.getContext('2d');
  g.clearRect(0,0,32,32);
  // background transparent
  // flame shape with flicker
  var flick = Math.sin(t*8 + seed)*1.2 + Math.sin(t*13+seed*1.3)*0.7;
  g.fillStyle='#2a1400';
  // outer flame
  g.beginPath();
  g.moveTo(16+flick*0.2, 28);
  g.quadraticCurveTo(6+ flick, 18, 10, 8+flick*0.3);
  g.quadraticCurveTo(16, 14+flick*0.5, 22, 8);
  g.quadraticCurveTo(26 - flick, 18, 16+flick*0.2, 28);
  g.closePath();
  g.fillStyle='#ff4a00'; g.fill();
  // inner
  g.beginPath();
  g.moveTo(16, 26);
  g.quadraticCurveTo(11, 18, 13, 10);
  g.quadraticCurveTo(16, 16, 19, 10);
  g.quadraticCurveTo(21, 18, 16, 26);
  g.closePath();
  g.fillStyle='#ff8c1a'; g.fill();
  // core
  g.beginPath();
  g.ellipse(16+flick*0.15, 20, 3.5, 5, 0, 0, Math.PI*2);
  g.fillStyle='#ffde59'; g.fill();
  g.fillStyle='#ffffff';
  g.fillRect(15,17,2,3);
  g.imageSmoothingEnabled=false;
}
function drawSmokeFrame(canvas, t){
  var g=canvas.getContext('2d');
  g.clearRect(0,0,16,16);
  var a = (Math.sin(t*1.7)*0.1+0.6);
  g.fillStyle='rgba(220,220,220,'+a+')';
  // puffs
  var y1 = 10 - (t % 1.0)*6;
  var x1 = 8 + Math.sin(t*2)*1.2;
  g.beginPath(); g.arc(x1, y1, 3.5, 0, Math.PI*2); g.fill();
  g.beginPath(); g.arc(x1+1, y1-3, 2.5, 0, Math.PI*2); g.fillStyle='rgba(200,200,200,'+(a*0.6)+')'; g.fill();
  g.beginPath(); g.arc(x1-1, y1-5, 1.8, 0, Math.PI*2); g.fillStyle='rgba(180,180,180,'+(a*0.35)+')'; g.fill();
}

    var r=32;
    var cx=0, cz=0, cy=4.5;
    camera.position.x = Math.cos(menuAngle)*r;
    camera.position.z = Math.sin(menuAngle)*r;
    camera.position.y = 22 + Math.sin(now*0.0005)*1.5;
    controls.target.set(cx + Math.cos(menuAngle+0.35)*1.2, cy, cz + Math.sin(menuAngle+0.35)*1.2);
    controls.update();
    if(cloudGroup){ cloudGroup.children.forEach(function(c,i){ c.position.x += Math.sin(now*0.00012 + i)*0.003; c.position.z += Math.cos(now*0.00009 + i)*0.001; }); }
    // animate any farm fires visible in menu? not needed
    if(furnaceGroup){
      var t=now*0.001;
      fireSprites.forEach(function(g){
        drawFireFrame(g.userData.canvas, t, g.userData.seed);
        g.userData.tex.needsUpdate=true;
        var sc=1+Math.sin(t*7+g.userData.seed)*0.06;
        g.scale.set(sc,sc,sc);
        if(g.userData.light){ g.userData.light.intensity = g.userData.light.userData.base + Math.sin(t*9+g.userData.seed)*0.5 + Math.random()*0.22; }
      });
      smokeSprites.forEach(function(s){
        s.userData.t += dt*0.9;
        if(s.userData.t>1) s.userData.t-=1;
        drawSmokeFrame(s.userData.canvas, s.userData.t);
        s.userData.tex.needsUpdate=true;
        s.position.y += dt*0.12;
        if(s.position.y> s.userData.baseY+2.5) s.position.y = s.userData.baseY+1.2;
        s.material.opacity=0.55*(1-s.userData.t*0.6);
      });
    }
    // gentle player bob if visible (menu hides player)
    if(skyDome)skyDome.position.copy(camera.position);renderFrame();
    var dbg=document.getElementById('debug');
    if(dbg) dbg.textContent='MENU — orbiting island | Click FREE RUN or FARM';
    return;
  }
  var mvX=0,mvZ=0;
  if(keys['w']||keys['arrowup']||keys['keyw']) mvZ-=1;
  if(keys['s']||keys['arrowdown']||keys['keys']) mvZ+=1;
  if(keys['a']||keys['arrowleft']||keys['keya']) mvX-=1;
  if(keys['d']||keys['arrowright']||keys['keyd']) mvX+=1;
  var moving=mvX!==0||mvZ!==0,targetVX=0,targetVZ=0;
  var yaw=Math.atan2(camera.position.x-controls.target.x,camera.position.z-controls.target.z),sn=Math.sin(yaw),cs=Math.cos(yaw);
  var curSpeed=sprint?7.2:4.35,worldDx=0,worldDz=0;
  if(moving){
    var len=Math.hypot(mvX,mvZ);mvX/=len;mvZ/=len;
    worldDx=mvX*cs+mvZ*sn;worldDz=-mvX*sn+mvZ*cs;targetVX=worldDx*curSpeed;targetVZ=worldDz*curSpeed;
    var targetYaw=Math.atan2(worldDx,worldDz),turn=targetYaw-player.rotation.y;
    while(turn>Math.PI)turn-=Math.PI*2;while(turn<-Math.PI)turn+=Math.PI*2;
    player.rotation.y+=turn*(1-Math.exp(-dt*14));
  }
  var accel=1-Math.exp(-dt*(grounded?13:5.5));velX+=(targetVX-velX)*accel;velZ+=(targetVZ-velZ)*accel;
  if(!moving){var brake=Math.exp(-dt*(grounded?15:2.2));velX*=brake;velZ*=brake;}

  var beforeH=floorBelow(playerX,playerZ,player.position.y),beforeGround=beforeH>=0?beforeH+1.01:.51;
  grounded=Math.abs(player.position.y-beforeGround)<.055&&velY<=.1;
  if(grounded)coyote=.13;else coyote=Math.max(0,coyote-dt);
  jBuffer=Math.max(0,jBuffer-dt);
  if(jBuffer>0&&coyote>0){velY=7.15;grounded=false;coyote=0;jBuffer=0;}

  function moveAxis(axis,amount){
    if(Math.abs(amount)<.00001)return;
    var testX=player.position.x+(axis==='x'?amount:0),testZ=player.position.z+(axis==='z'?amount:0);
    var bx=Math.floor(testX+WORLD/2),bz=Math.floor(testZ+WORLD/2);
    if(bx<0||bx>=WORLD||bz<0||bz>=WORLD){player.position[axis]+=amount;return;}
    var obstacle=floorBelow(bx,bz,player.position.y),surface=obstacle>=0?obstacle+1:-999;
    if(surface<=player.position.y+.08&&!bodyBlocked(bx,bz,player.position.y)){player.position[axis]+=amount;playerX=bx;playerZ=bz;}
    else if(axis==='x')velX=0;else velZ=0;
  }
  moveAxis('x',velX*dt);moveAxis('z',velZ*dt);

  wasGrounded=grounded;var previousFeet=player.position.y;velY-=19*dt;player.position.y+=velY*dt;
  if(velY>0&&bodyBlocked(playerX,playerZ,player.position.y)){player.position.y=previousFeet;velY=0;}
  playerX=Math.floor(player.position.x+WORLD/2);playerZ=Math.floor(player.position.z+WORLD/2);
  var ground=playerX>=0&&playerX<WORLD&&playerZ>=0&&playerZ<WORLD?floorBelow(playerX,playerZ,Math.max(previousFeet,player.position.y)):-1;
  var groundY=ground>=0?ground+1.01:.51;
  if(velY<=0&&player.position.y<=groundY){player.position.y=groundY;velY=0;grounded=true;}else grounded=false;
  if(!wasGrounded&&grounded)landBounce=1;
  playerY=player.position.y;playerTargetY=groundY;

  var ud=player.userData,speed=Math.hypot(velX,velZ),poseRate=1-Math.exp(-dt*16);
  if(ud){
    if(grounded&&speed>.12)ud.phase+=dt*speed*(sprint?2.15:2.45);
    var stride=grounded&&speed>.12?Math.sin(ud.phase)*(sprint?.86:.62):0;
    var legLT=grounded?stride:.3,legRT=grounded?-stride:-.34;
    var armLT=grounded?-stride*.82:-.5,armRT=grounded?stride*.82:-.5;
    ud.legL.rotation.x+=(legLT-ud.legL.rotation.x)*poseRate;ud.legR.rotation.x+=(legRT-ud.legR.rotation.x)*poseRate;
    ud.armL.rotation.x+=(armLT-ud.armL.rotation.x)*poseRate;ud.armR.rotation.x+=(armRT-ud.armR.rotation.x)*poseRate;
    var idle=Math.sin(now*.0024),bob=grounded&&speed>.12?Math.abs(Math.sin(ud.phase))*.045:idle*.012;
    landBounce*=Math.exp(-dt*11);ud.rig.position.y=bob-landBounce*.055;
    ud.rig.scale.y=1-landBounce*.07;ud.rig.scale.x=ud.rig.scale.z=1+landBounce*.035;
    var targetLean=grounded&&sprint&&speed>4?.11:0;ud.rig.rotation.x+=(targetLean-ud.rig.rotation.x)*poseRate;
    ud.head.rotation.y+=(idle*.035-ud.head.rotation.y)*(1-Math.exp(-dt*4));
  }
  var desiredTarget=new THREE.Vector3(player.position.x,player.position.y+.55,player.position.z);
  var follow=desiredTarget.sub(controls.target).multiplyScalar(1-Math.exp(-dt*9));controls.target.add(follow);camera.position.add(follow);
  wasGrounded=grounded;
  if(cloudGroup){ cloudGroup.children.forEach(function(c,i){ c.position.x += Math.sin(now*0.00012 + i)*0.003; c.position.z += Math.cos(now*0.00009 + i)*0.001; }); }
  // fire + smoke anim
  if(furnaceGroup && gameMode==='farm'){
    var t=now*0.001;
    fireSprites.forEach(function(g){
      drawFireFrame(g.userData.canvas, t, g.userData.seed);
      g.userData.tex.needsUpdate=true;
      var sc=1+Math.sin(t*7+g.userData.seed)*0.06;
      g.children[0].scale.set(sc,sc,1); g.children[1].scale.set(sc,sc,1);
      // billboard to camera a bit? keep crossed so no need
      if(g.userData.light){ g.userData.light.intensity = g.userData.light.userData.base + Math.sin(t*9+g.userData.seed)*0.5 + Math.random()*0.22; }
    });
    smokeSprites.forEach(function(s){
      s.userData.t += dt*0.55;
      if(s.userData.t>1) s.userData.t=0;
      drawSmokeFrame(s.userData.canvas, s.userData.t);
      s.material.map.needsUpdate=true;
      s.position.y += dt*0.35;
      // drift
      s.position.x += Math.sin(t*0.8+s.userData.t)*0.002;
    });
  }
  controls.update();
  var dbg=document.getElementById('debug');
  if(dbg){ var fps=Math.round(1/dt); dbg.textContent='POS '+playerX+','+playerZ+' Y'+player.position.y.toFixed(2)+'  VY'+velY.toFixed(1)+' | KEYS '+(keys['w']?'W':'-')+(keys['a']?'A':'-')+(keys['s']?'S':'-')+(keys['d']?'D':'-')+(keys[' ']?' JUMP':'')+(sprint?' SPRINT':'')+' | MODE '+gameMode.toUpperCase()+' | FPS '+fps+' | ESC menu'; dbg.style.color = (keys['w']||keys['a']||keys['s']||keys['d'])?'#ffde59':'#7fffaa'; }
  if(skyDome)skyDome.position.copy(camera.position);renderFrame();
}
function onResize(){
  var el=document.getElementById('game');
  var aspect=el.clientWidth/el.clientHeight;
  var d=15;
  camera.left=-d*aspect; camera.right=d*aspect; camera.top=d; camera.bottom=-d;
  camera.updateProjectionMatrix();
  renderer.setSize(el.clientWidth, el.clientHeight);
  resizePost();
}
loadTextures().then(init).catch(function(err){document.querySelector('.menu-card .sub').textContent='Unable to load textures. Please refresh.';console.error(err);});
})();
</script>
</body>
</html>
